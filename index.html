<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Authorization Complete</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f3f2f1;
    font-family:"Segoe UI Variable","Segoe UI",Arial,sans-serif;
}

.card{
    background:#fff;
    padding:48px 64px;
    border-radius:8px;
    border:1px solid #edebe9;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
    text-align:center;
}

.check{
    width:56px;
    height:56px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#107C10;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:600;
}

h1{
    margin:0;
    font-size:28px;
    font-weight:600;
    color:#323130;
}

p{
    margin-top:12px;
    color:#605e5c;
    font-size:15px;
}
</style>

</head>

<body>

<div class="card">
    <div class="check">✓</div>
    <h1>Authorization complete</h1>
    <p>You may close this window.</p>
</div>

</body>
</html>
